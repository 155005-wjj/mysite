{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">新建靓号</h3>
    </div>
    <div class="panel-body">
        <form method="post" class="form-horizontal">
            {% csrf_token %}

            {% if error %}
            <div class="alert alert-danger" role="alert">
                {% for msg in error.values %}
                <div>{{ msg }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="form-group">
                <label class="col-sm-2 control-label">号码</label>
                <div class="col-sm-10">
                    <input type="text" name="mobile" class="form-control" placeholder="请输入11位靓号号码"
                           value="{{ data.mobile|default:'' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">价格</label>
                <div class="col-sm-10">
                    <input type="number" name="price" class="form-control" placeholder="请输入价格"
                           value="{{ data.price|default:'0' }}">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">级别</label>
                <div class="col-sm-10">
                    <input type="number" name="level" class="form-control" placeholder="请输入级别数字"
                           value="{{ data.level|default:'1' }}" min="1" max="4">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-2 control-label">状态</label>
                <div class="col-sm-10">
                    <select name="status" class="form-control">
                        <option value="2" {% if data.status == "2" %}selected{% endif %}>未占用</option>
                        <option value="1" {% if data.status == "1" %}selected{% endif %}>已占用</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button type="submit" class="btn btn-success">提交</button>
                    <a href="/pretty/list/" class="btn btn-default">返回列表</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
